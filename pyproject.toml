[project]
name = "comfyui-henjicc"
version = "0.1.0"
description = "Media input and library, reference images, resolution tools, local prompt assistants, MiniMax H3 adapters and audio mixing for ComfyUI."
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["aiohttp", "av", "numpy", "Pillow"]

# ComfyUI, comfy_api, torch and matching torchaudio are provided by the host.
# Do not upgrade the host framework to install optional audio capabilities.
[project.optional-dependencies]
omni = ["transformers>=5", "soundfile", "librosa", "accelerate"]

[project.urls]
Repository = "https://github.com/henjicc/ComfyUI-Henjicc"
Documentation = "https://github.com/henjicc/ComfyUI-Henjicc/blob/main/README.md"
"Bug Tracker" = "https://github.com/henjicc/ComfyUI-Henjicc/issues"

[tool.comfy]
PublisherId = "henjicc"
DisplayName = "ComfyUI-Henjicc · 痕继痕迹"
