name: Publish to Comfy Registry

on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comfy-registry-publish
  cancel-in-progress: false

env:
  COMFY_NO_TELEMETRY: '1'

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check whether the version changed
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: python
        run: |
          import os
          import pathlib
          import subprocess
          import tomllib

          current = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          previous = None
          before = os.environ.get('BEFORE_SHA', '')
          if os.environ['GITHUB_EVENT_NAME'] == 'push' and before and set(before) != {'0'}:
              previous = tomllib.loads(subprocess.check_output(
                  ['git', 'show', f'{before}:pyproject.toml'], encoding='utf-8'
              ))['project']['version']
          should_publish = os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' or current != previous
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'publish={str(should_publish).lower()}\n')
          print(f'Version: {previous} -> {current}; publish: {should_publish}')
      - name: Install publishing tools
        if: steps.version.outputs.publish == 'true'
        run: python -m pip install comfy-cli==1.22.0
      - name: Validate the node pack
        if: steps.version.outputs.publish == 'true'
        run: |
          comfy --no-enable-telemetry node validate
          python -m ruff check . --select S102,S307,E702
      - name: Publish this version
        if: steps.version.outputs.publish == 'true'
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        shell: python
        run: |
          import os
          import pathlib
          import tomllib
          import urllib.error
          import urllib.request

          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']
          version = project['version']
          url = f"https://api.comfy.org/nodes/{project['name']}/versions/{version}"
          try:
              with urllib.request.urlopen(url, timeout=30):
                  exists = True
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              exists = False
          if exists:
              message = f'Version {version} is already uploaded; no duplicate upload was attempted.'
          else:
              token = os.environ.get('REGISTRY_ACCESS_TOKEN', '')
              if not token:
                  raise SystemExit('Missing GitHub Actions secret: REGISTRY_ACCESS_TOKEN')
              notes = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
              changelog = notes.split(f'## {version}\n', 1)[1].split('\n## ', 1)[0].strip()
              from comfy_cli.command.custom_nodes.command import publish
              publish(token=token, changelog=changelog, changelog_file=None)
              message = f'Uploaded {version} to Comfy Registry. Availability still depends on Registry review.'
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(message + '\n')
